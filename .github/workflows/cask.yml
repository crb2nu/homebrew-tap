name: cask

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: install checkout as a tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap crb2nu/tap "file://$GITHUB_WORKSPACE"
          brew style --cask crb2nu/tap/edilint
          brew audit --cask --online crb2nu/tap/edilint
          brew install --cask crb2nu/tap/edilint
          edilint --version
          printf 'ABC|one\n' | edilint --no-config --format text --json - > report.json
          python3 -c 'import json; r=json.load(open("report.json")); assert r["summary"]["total"] == 0, r'
          brew uninstall --cask edilint
