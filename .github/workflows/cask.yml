name: cask

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: install checkout as a tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap crb2nu/tap "file://$GITHUB_WORKSPACE"
          # Homebrew 6 loads a non-official tap's cask for audit and info only
          # once it is trusted (docs/Tap-Trust.md). Trust the one cask, as the
          # docs prefer, rather than the whole tap. A fully qualified
          # `brew install --cask crb2nu/tap/edilint` trusts the item by itself,
          # so users need no extra step. Older Homebrew has no trust command.
          if brew help trust >/dev/null 2>&1; then
            brew trust --cask crb2nu/tap/edilint
          fi
          brew style --cask crb2nu/tap/edilint
          brew audit --cask --online crb2nu/tap/edilint
          brew install --cask crb2nu/tap/edilint
          cask_version="$(brew info --cask --json=v2 crb2nu/tap/edilint | python3 -c 'import json, sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          installed_version="$("$(brew --prefix)/bin/edilint" --version)"
          test "$installed_version" = "edilint $cask_version"
          printf 'ABC|one\n' | "$(brew --prefix)/bin/edilint" --no-config --format text --json - > report.json
          python3 -c 'import json; r=json.load(open("report.json")); assert r["summary"]["total"] == 0, r'
          brew uninstall --cask edilint
